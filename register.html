<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

       <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 
    <style>
        /* From Uiverse.io by Harsha2lucky */ 
.content {
  width: 330px;
  padding: 40px 30px;
  background: #dde1e7;
  border-radius: 10px;
  box-shadow: -3px -3px 7px #ffffff73,
               2px 2px 5px rgba(94,104,121,0.288);
}

.content .text {
  font-size: 33px;
  font-weight: 600;
  margin-bottom: 35px;
  color: #595959;
}

.field {
  height: 50px;
  width: 100%;
  display: flex;
  position: relative;
}

.field:nth-child(2) {
  margin-top: 20px;
}

.field .input {
  height: 100%;
  width: 100%;
  padding-left: 45px;
  outline: none;
  border: none;
  font-size: 18px;
  background: #dde1e7;
  color: #595959;
  border-radius: 25px;
  box-shadow: inset 2px 2px 5px #BABECC,
              inset -5px -5px 10px #ffffff73;
}

.field .input:focus {
  box-shadow: inset 1px 1px 2px #BABECC,
              inset -1px -1px 2px #ffffff73;
}

.field .span {
  position: absolute;
  color: #595959;
  width: 50px;
  line-height: 55px;
}

.field .label {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  left: 45px;
  pointer-events: none;
  color: #666666;
}

.field .input:valid ~ label {
  opacity: 0;
}

.forgot-pass {
  text-align: left;
  margin: 10px 0 10px 5px;
}

.forgot-pass a {
  font-size: 16px;
  color: #666666;
  text-decoration: none;
}

.forgot-pass:hover a {
  text-decoration: underline;
}

.button {
  margin: 15px 0;
  width: 100%;
  height: 50px;
  font-size: 18px;
  line-height: 50px;
  font-weight: 600;
  background: #dde1e7;
  border-radius: 25px;
  border: none;
  outline: none;
  cursor: pointer;
  color: #595959;
  box-shadow: 2px 2px 5px #BABECC,
             -5px -5px 10px #ffffff73;
}

.button:focus {
  color: #3498db;
  box-shadow: inset 2px 2px 5px #BABECC,
             inset -5px -5px 10px #ffffff73;
}

.sign-up {
  margin: 10px 0;
  color: #595959;
  font-size: 16px;
}

.sign-up a {
  color: #3498db;
  text-decoration: none;
}

.sign-up a:hover {
  text-decoration: underline;
}
    </style>
</head>
<body>
  <center>
    <!-- From Uiverse.io by Harsha2lucky --> 
     <div class="content m-5">
         <div class="text text-primary">
           <h3>🏦 My Bank</h3>
         </div>
         <form id="myform">
            
            <div class="field">
               <input required="" type="text" class="input" id="uname">
              <label class="label">Username</label>
            </div>
            <div class="field">
               <input required="" type="text" class="input" id="accnum">
                  <label class="label">Account Number</label>
            </div>
            <br>
            <div class="field">
               <input required="" type="password" class="input" id="password">
         <label class="label">Password</label>
            </div>
            
           <button type="button" class="button text-white bg-primary" onclick="Register()">Register</button>            <div class="sign-up text-center">
             
               <a href="./login.html">sign in</a>
            </div>
         </form>
      </div>
    </center>
</body>
<script >
   // Registration

function Register()
{
    const user = {
        username: document.getElementById('uname').value,
        accno: document.getElementById('accnum').value,
        password: document.getElementById('password').value
    };

    if (user.accno in localStorage)
    {
        alert("User Already Registered");
    }
    else
    {
        localStorage.setItem(user.accno, JSON.stringify(user));

        console.log(user.accno, user.username, user.password);

        alert("User Registration Successful");
         window.location='./login.html'
    }

    document.getElementById('myform').reset();
}


// login
</script>
</html>
